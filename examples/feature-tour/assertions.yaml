server: python ../../tests/fixtures/fixture_server.py

tests:
  - name: validates a complete user payload
    call: get_user
    args: {user_id: 1}
    timeout_s: 5
    expect:
      is_error: false
      contains: [Ada, admin]
      not_contains: password
      matches: '"name":\s*"Ada"'
      max_latency_ms: 5000
      json_path:
        id: 1
        name: Ada
        roles.0: admin
      schema:
        type: object
        required: [id, name, roles]
        properties:
          id: {type: integer}
          name: {type: string}
          roles:
            type: array
            items: {type: string}

  - name: accepts an expected tool error
    call: get_user
    args: {user_id: 999}
    expect:
      is_error: true
      contains: not found
