# From the repository root with the development environment activated:
# mcp-rig run examples/fixture.yaml --junit /tmp/mcp-rig-results.xml
server: python ../tests/fixtures/fixture_server.py

tests:
  - name: adds two numbers
    call: add
    args: {a: 2, b: 3}
    expect:
      contains: "5"

  - name: unknown user returns an error
    call: get_user
    args: {user_id: 42}
    expect:
      is_error: true
      contains: "not found"

  - name: user payload is valid and fast
    call: get_user
    args: {user_id: 1}
    timeout_s: 5
    expect:
      is_error: false
      contains: "Ada"
      not_contains: "password"
      matches: "Ada"
      max_latency_ms: 5000
      json_path:
        name: Ada
        roles.0: admin
      schema:
        type: object
        required: [id, name, roles]
        properties:
          id: {type: integer}
          name: {type: string}
          roles: {type: array}
